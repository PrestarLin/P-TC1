name: Build and Release

on:
  push:
    branches: [dev, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make python3 dash perl
        # MiCO makefiles call /usr/bin/python (see micoder_host_cmd.mk Linux64 branch)
        sudo ln -sf /usr/bin/python3 /usr/bin/python
        # Install ARM GCC 5.4-2016q2 into the MiCO SDK's expected path
        # The makefile looks for: $(SOURCE_ROOT)mico-os/MiCoder/compiler/arm-none-eabi-5_4-2016q2-20160622/Linux64/bin/
        # developer.arm.com URL is dead (404); use the Launchpad librarian mirror
        wget -q -L https://launchpadlibrarian.net/268330503/gcc-arm-none-eabi-5_4-2016q2-20160622-linux.tar.bz2
        tar -xjf gcc-arm-none-eabi-5_4-2016q2-20160622-linux.tar.bz2
        mkdir -p mico-os/MiCoder/compiler/arm-none-eabi-5_4-2016q2-20160622/Linux64
        # The tarball extracts to gcc-arm-none-eabi-5_4-2016q2/{bin,lib,libexec,...};
        # move its contents so that .../Linux64/bin/arm-none-eabi-gcc exists (TOOLCHAIN_PATH)
        mv gcc-arm-none-eabi-5_4-2016q2/* mico-os/MiCoder/compiler/arm-none-eabi-5_4-2016q2-20160622/Linux64/
        # Provide the MiCoder host tools the makefiles expect under $(TOOLS_ROOT)/cmd/Linux64/
        # (SHELL=dash, CAT, ECHO_BLANK_LINE, MKDIR, RMDIR, CPDIR, CLEAN_COMMAND, RM, CP, MV, MAKE)
        mkdir -p mico-os/MiCoder/cmd/Linux64
        for t in dash cat echo rm mkdir cp mv make; do
          ln -sf /usr/bin/$t mico-os/MiCoder/cmd/Linux64/$t
        done

    - name: Get version and auto-increment
      id: version
      run: |
        version_file=".version"
        if [ ! -f $version_file ]; then echo "v4.1.0" > $version_file; fi
        ver=$(cat $version_file)
        major=$(echo $ver | cut -d. -f1 | sed 's/v//')
        minor=$(echo $ver | cut -d. -f2)
        patch=$(echo $ver | cut -d. -f3)
        if [ -z "$patch" ] || [ "$patch" -eq 0 ]; then
          patch=1
        else
          patch=$((patch + 1))
        fi
        if [ "$patch" -gt 99 ]; then
          patch=1
          minor=$((minor + 1))
        fi
        new_ver="v${major}.${minor}.${patch}"
        echo $new_ver > $version_file
        echo "version=$new_ver" >> $GITHUB_OUTPUT

    - name: Generate web assets
      run: |
        cd TC1/http_server
        python3 test.py > web_data.c
        cd ../..

    - name: Build firmware
      run: |
        make -f mico-os/makefiles/Makefile TC1@MK3031@moc total SOURCE_ROOT=$PWD/ HOST_OS=Linux64 EXTERNAL_MiCO_GLOBAL_DEFINES="COMMIT_HASH=$(git rev-parse --short HEAD)"

    - name: Copy OTA binary
      run: |
        cp ./build/TC1@MK3031@moc/binary/TC1@MK3031@moc.ota.bin ./build/TC1@MK3031@moc/binary/ota.bin

    - name: Collect commit titles
      id: commits
      run: |
        if [ "$GITHUB_REF" = "refs/heads/master" ]; then
          PREV=$(git tag -l 'v*' --sort=-creatordate | grep -v -- '-dev' | head -1 || true)
        else
          PREV=$(git tag -l 'v*' --sort=-creatordate | head -1 || true)
        fi
        if [ -n "$PREV" ]; then
          git log --oneline --no-merges "${PREV}..HEAD" | head -40 | sed 's/^/- /' > commits.txt
        else
          git log --oneline --no-merges -20 HEAD | sed 's/^/- /' > commits.txt
        fi
        if [ ! -s commits.txt ]; then echo "- (无新增提交)" > commits.txt; fi
        { echo "commits<<EOF"; cat commits.txt; echo "EOF"; } >> "$GITHUB_OUTPUT"

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: P-TC1-${{ steps.version.outputs.version }}
        path: |
          build/TC1@MK3031@moc/binary/*.bin
          .version

    - name: Push version bump
      if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .version
        git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
        git push origin ${{ github.ref_name }}

    - name: Create Release (master)
      if: github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## P-TC1 Firmware ${{ steps.version.outputs.version }}

          ### 更新内容
          ${{ steps.commits.outputs.commits }}

          ### 固件文件
          - `ota.bin` - OTA 升级固件（通过Web后台OTA上传）
          - `TC1@MK3031@moc.ota.bin` - OTA 升级固件（完整包）
          - `TC1@MK3031@moc.all.bin` - 全量固件（含Bootloader，需烧录器写入）
        files: |
          build/TC1@MK3031@moc/binary/ota.bin
          build/TC1@MK3031@moc/binary/TC1@MK3031@moc.ota.bin
          build/TC1@MK3031@moc/binary/TC1@MK3031@moc.all.bin
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Prerelease (dev)
      if: github.ref == 'refs/heads/dev'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Dev Build ${{ steps.version.outputs.version }}
        body: |
          ## P-TC1 Development Build ${{ steps.version.outputs.version }}

          > ⚠️ 这是开发版本，可能包含未稳定功能，请谨慎使用。

          ### 更新内容
          ${{ steps.commits.outputs.commits }}

          ### 固件文件
          - `ota.bin` - OTA 升级固件
          - `TC1@MK3031@moc.ota.bin` - OTA 升级固件（完整包）
          - `TC1@MK3031@moc.all.bin` - 全量固件
        files: |
          build/TC1@MK3031@moc/binary/ota.bin
          build/TC1@MK3031@moc/binary/TC1@MK3031@moc.ota.bin
          build/TC1@MK3031@moc/binary/TC1@MK3031@moc.all.bin
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}